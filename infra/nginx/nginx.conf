# DNS nội bộ của Docker: phân giải lại tên service khi container được tạo lại (đổi IP),
# tránh 502 "Connection refused" vì nginx giữ IP cũ từ lúc khởi động.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:4000 resolve;
}

upstream ai_upstream {
    zone ai_upstream 64k;
    server ai-service:8000 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # File sao lưu toàn bộ dữ liệu có thể lớn hơn giới hạn chung 10 MB
    location = /api/v1/admin/backup/restore {
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Video giới thiệu dự án: tối đa 2 phút / 200 MB (kiểm tra lại ở backend), tải lên lâu hơn ảnh
    location = /api/v1/media/videos {
        client_max_body_size 210m;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /ai/ {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

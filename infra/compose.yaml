name: crowdfunding-platform

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${STAGING_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
    environment:
      NODE_ENV: ${APP_ENV:-development}
      PORT: 4000
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      DATABASE_URL: mysql://${MYSQL_USER:-crowdfunding_app}:${MYSQL_PASSWORD:-local-only-change-me}@mysql:3306/${MYSQL_DATABASE:-crowdfunding}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000/api/v1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-refresh-secret-change-me}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-service:
    build:
      context: ../ai-service
    environment:
      APP_ENV: ${APP_ENV:-development}
      AI_MODEL_PATH: ${AI_MODEL_PATH:-/app/models/success_model.pkl}
      AI_LOAD_MODEL: ${AI_LOAD_MODEL:-false}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ../ai-service/models:/app/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crowdfunding}
      MYSQL_USER: ${MYSQL_USER:-crowdfunding_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-only-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:

        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách người dùng (admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/audit-logs:
    get:

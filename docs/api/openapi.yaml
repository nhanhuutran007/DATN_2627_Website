      summary: Khóa/mở khóa tài khoản người dùng
      description: >-
        Admin không tự khóa chính mình. Ghi audit `user.status.update`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: Đã cập nhật trạng thái tài khoản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Admin cố tự khóa chính mình
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reports:
    post:
      operationId: createReport
      summary: Báo cáo vi phạm một chiến dịch đã công khai
      description: >-
        Người dùng đã đăng nhập gửi báo cáo; không báo cáo được chiến dịch của chính mình
        (403) hoặc chiến dịch chưa công khai (404). Mỗi người chỉ có một báo cáo mở
        (pending/reviewing) cho mỗi chiến dịch (409). Rate limit 5 lần/10 phút/IP.
        Hệ thống không tự ẩn/tạm dừng chiến dịch theo số báo cáo. Ghi audit `report.create`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Đã tạo báo cáo (status = pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Dữ liệu không hợp lệ (mô tả 10–2000 ký tự)
        "401":
          description: Chưa đăng nhập
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Đã có báo cáo đang mở cho chiến dịch này
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /reports/mine:
    get:
      operationId: listMyReports
      summary: Các báo cáo tôi đã gửi (tối đa 50, mới nhất trước)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách báo cáo của người dùng hiện tại
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "401":
          description: Chưa đăng nhập
  /admin/reports:
    get:
      operationId: adminListReports
      summary: Hàng đợi báo cáo vi phạm (kèm chiến dịch và người báo cáo)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - name: reason
          in: query
          schema:
            $ref: "#/components/schemas/ReportReason"
        - name: campaignId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách báo cáo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/reports/{id}:
    patch:
      operationId: adminReviewReport
      summary: Xem xét / kết luận một báo cáo (human-in-the-loop)
      description: >-
        Chuyển trạng thái theo ma trận pending → reviewing | resolved | dismissed,
        reviewing → resolved | dismissed; resolved/dismissed là kết luận cuối (409 nếu mở lại).
        Kết luận bắt buộc `adminNotes` ≥ 5 ký tự. `pauseCampaign: true` (chỉ khi resolved)
        tạm dừng chiến dịch qua luồng moderate (chiến dịch phải đang `active`, nếu không 409 và
        báo cáo giữ nguyên). Ghi audit `report.review` (và `campaign.moderate` nếu tạm dừng).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewReportRequest"
      responses:
        "200":
          description: Đã cập nhật báo cáo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Thiếu ghi chú khi kết luận, hoặc pauseCampaign khi không resolved
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Chuyển trạng thái không hợp lệ hoặc chiến dịch không tạm dừng được

  /campaigns/stats:
    get:
      operationId: getPlatformStats
      summary: Thống kê công khai toàn nền tảng (sổ quỹ chung)
      description: >-
        Tính trực tiếp từ bảng campaigns trên các chiến dịch đã công khai. `totalRaised` chỉ gồm
        tiền từ giao dịch đã được cổng thanh toán xác nhận (currentAmount chỉ tăng khi webhook/confirm hợp lệ).
      responses:
        "200":
          description: Số liệu tổng hợp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"
  /campaigns/{id}/donations:
    get:
      operationId: getCampaignLedger
      summary: Sổ cái giao dịch công khai của một chiến dịch
      description: >-
        Chỉ giao dịch `completed`, mới nhất trước. Không trả email, lời nhắn hay mã giao dịch đầy đủ
        (`reference` chỉ giữ 6 ký tự cuối). Người chọn ẩn danh có `donorName = null`.
        Chiến dịch chưa công khai trả 404.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Danh sách giao dịch đã xác nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignLedger"
        "404":
          $ref: "#/components/responses/NotFound"

  /media/images:
    post:
      operationId: uploadImage
      summary: Tải ảnh lên (ảnh chiến dịch, ảnh bài cập nhật tiến độ)
      description: >-
        Người dùng đã đăng nhập gửi `multipart/form-data` với field `file` (một file).
        Server nhận diện loại ảnh theo magic bytes của nội dung (JPEG/PNG/WebP), không tin
        đuôi tên file hay Content-Type của client; tối đa 5 MB. Khóa lưu trữ do server sinh
        (UUID). Lưu ra ổ đĩa (`STORAGE_DRIVER=local`) hoặc S3 (`STORAGE_DRIVER=s3`).
        Rate limit 30 lần/15 phút/IP. Ghi audit `media.upload`. `url` trả về là đường dẫn
        tương đối, dùng trực tiếp cho `imageUrl` của chiến dịch/bài cập nhật.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [campaign_image, progress_image]
                  default: campaign_image
      responses:
        "201":
          description: Đã lưu ảnh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedImage"
        "400":
          description: Thiếu file, file rỗng hoặc không phải ảnh JPEG/PNG/WebP
        "401":
          description: Chưa đăng nhập
        "413":
          description: Ảnh lớn hơn 5 MB
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /media/{folder}/{file}:
    get:
      operationId: getMediaFile
      summary: Trả ảnh đã tải lên (công khai)
      description: >-
        Chỉ trả file có bản ghi trong `media_files` và chưa bị xóa. Header
        `Cache-Control: public, max-age=31536000, immutable` (tên file là UUID, nội dung
        không đổi) và `Cross-Origin-Resource-Policy: cross-origin`.
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
            enum: [campaigns, progress]
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f-]{36}\.(jpg|png|webp)$'
      responses:
        "200":
          description: Nội dung ảnh
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications:
    get:
      operationId: listNotifications
      summary: Danh sách thông báo của người dùng hiện tại (mới nhất trước)
      description: >-
        Thông báo trong ứng dụng phát khi: chiến dịch đổi trạng thái (duyệt/từ chối/cần bổ sung/
        tạm dừng/tiếp tục/kết thúc — gửi chủ dự án, một số gửi cả người đã ủng hộ), khoản ủng hộ
        được xác nhận (gửi người ủng hộ và chủ dự án, không nêu tên người ủng hộ), hoàn thành mốc
        hoặc có bài cập nhật tiến độ (gửi người đã ủng hộ), báo cáo vi phạm được kết luận (gửi
        người báo cáo, không kèm ghi chú nội bộ). Kết quả xét duyệt gửi kèm email cho chủ dự án.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: unread
          in: query
          description: "`true` để chỉ lấy thông báo chưa đọc"
          schema: { type: boolean }
      responses:
        "200":
          description: Trang thông báo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          description: Chưa đăng nhập
  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Số thông báo chưa đọc (cho chuông trên header)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Số chưa đọc
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer }
        "401":
          description: Chưa đăng nhập
  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      summary: Đánh dấu mọi thông báo của mình là đã đọc
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Số thông báo đã cập nhật
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      summary: Đánh dấu một thông báo là đã đọc
      description: Chỉ chủ thông báo; thông báo của người khác trả 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Thông báo sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          $ref: "#/components/responses/NotFound"

  /campaigns/{id}/comments:
    get:
      operationId: listCampaignComments
      summary: Hỏi đáp & bình luận công khai của chiến dịch
      description: >-
        Chỉ chiến dịch đã công khai (chưa công khai trả 404). Bình luận gốc mới nhất trước,
        mỗi bình luận kèm các trả lời (1 cấp) theo thứ tự thời gian. Bình luận bị ẩn/xóa không
        hiển thị. Người viết chỉ trả tên + avatar, `isOwner` = chủ dự án.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Trang luồng bình luận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentThreadPage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCampaignComment
      summary: Đặt câu hỏi, bình luận hoặc trả lời
      description: >-
        Nội dung 2–2000 ký tự (đã bỏ ký tự điều khiển). `parentId` để trả lời một bình luận gốc
        đang hiển thị của cùng chiến dịch (chỉ 1 cấp; trả lời luôn là `comment`). Thông báo cho
        chủ dự án (bình luận/câu hỏi mới) và người được trả lời. Rate limit 10 lần/10 phút/IP.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 2, maxLength: 2000 }
                kind: { type: string, enum: [comment, question], default: comment }
                parentId: { type: string, format: uuid }
      responses:
        "201":
          description: Đã đăng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentView"
        "400":
          description: Nội dung không hợp lệ hoặc trả lời vào một câu trả lời
        "401":
          description: Chưa đăng nhập
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /comments/{id}:
    delete:
      operationId: deleteComment
      summary: Xóa (mềm) bình luận của mình; admin xóa được mọi bình luận
      description: Ghi audit `comment.delete`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Đã xóa
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/comments:
    get:
      operationId: listAdminComments
      summary: Hàng đợi kiểm duyệt bình luận (chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [visible, hidden] }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Danh sách bình luận kèm chiến dịch và người viết
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/comments/{id}/hide:
    patch:
      operationId: hideComment
      summary: Ẩn bình luận (chỉ admin, bắt buộc lý do)
      description: Ghi audit `comment.hide`, thông báo cho tác giả kèm lý do. Đã ẩn trả 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: Bình luận sau khi ẩn
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Bình luận đã bị ẩn
  /admin/comments/{id}/unhide:
    patch:
      operationId: unhideComment
      summary: Hiện lại bình luận (chỉ admin)
      description: Ghi audit `comment.unhide`. Đang hiển thị trả 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Bình luận sau khi hiện lại
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Bình luận đang hiển thị

  /campaigns/{id}/reward-tiers:
    get:
      operationId: listRewardTiers
      summary: Mức ủng hộ & phần quà đang nhận (công khai)
      description: Chỉ chiến dịch đã công khai; mức đang tắt không hiển thị. `remaining` = null nếu không giới hạn.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Danh sách mức quà
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardTier"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRewardTier
      summary: Thêm mức quà (chủ dự án/admin)
      description: >-
        Tối đa 10 mức mỗi chiến dịch; không thêm khi chiến dịch đã kết thúc (409). Ghi audit
        `reward_tier.create`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardTierRequest"
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardTier"
        "400":
          description: Dữ liệu không hợp lệ hoặc vượt 10 mức
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Chiến dịch đã kết thúc
  /campaigns/{id}/reward-tiers/manage:
    get:
      operationId: listManagedRewardTiers
      summary: Mọi mức quà kể cả đang tắt (chủ dự án/admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Danh sách mức quà
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardTier"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campaigns/{id}/reward-claims:
    get:
      operationId: listRewardClaims
      summary: Người nhận quà để chủ dự án chuẩn bị gửi (chỉ khoản đã xác nhận)
      description: Người ủng hộ chọn ẩn danh hiển thị "Ẩn danh"; không trả thông tin thanh toán.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Danh sách nhận quà
        "403":
          $ref: "#/components/responses/Forbidden"
  /reward-tiers/{id}:
    patch:
      operationId: updateRewardTier
      summary: Sửa / tắt-mở mức quà (chủ dự án/admin)
      description: >-
        Sau khi chiến dịch phát hành không đổi được `minAmount` (409); `quantityLimit` không thấp
        hơn số suất đã nhận (409). Ghi audit `reward_tier.update`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RewardTierRequest"
              properties:
                isActive: { type: boolean }
      responses:
        "200":
          description: Mức quà sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardTier"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Vi phạm quy tắc sửa sau phát hành
    delete:
      operationId: deleteRewardTier
      summary: Xóa (mềm) mức quà chưa có ai chọn
      description: Mức đã có người chọn trả 409 (hãy tắt thay vì xóa). Ghi audit `reward_tier.delete`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Đã xóa
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Mức đã có người chọn

  /donations/{id}/receipt:
    get:
      operationId: getDonationReceipt
      summary: Biên nhận một khoản ủng hộ (người ủng hộ hoặc admin)
      description: >-
        Chỉ khoản đã xác nhận hoặc đã hoàn (409 nếu chưa xác nhận). Người khác nhận 404. Frontend
        hiển thị ở `/bien-nhan/{id}` và in/lưu PDF bằng trình duyệt. Không phải hóa đơn thuế.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Biên nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationReceipt"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Khoản ủng hộ chưa xác nhận
  /donations/{id}/refund-request:
    post:
      operationId: requestRefund
      summary: Người ủng hộ yêu cầu hoàn một khoản của mình
      description: >-
        Được yêu cầu khi chiến dịch thất bại/bị hủy, hoặc trong 7 ngày sau khi ủng hộ nếu chiến dịch
        còn đang gây quỹ (409 nếu không đủ điều kiện hoặc đã có yêu cầu chờ xử lý). Admin duyệt.
        Rate limit 5 lần/giờ/IP. Ghi audit `refund.request`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "201":
          description: Đã tạo yêu cầu (pending)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Không đủ điều kiện hoặc trùng yêu cầu
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /refund-requests/mine:
    get:
      operationId: listMyRefundRequests
      summary: Yêu cầu hoàn tiền của tôi
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách yêu cầu
  /admin/refunds:
    get:
      operationId: listAdminRefunds
      summary: Hàng đợi yêu cầu hoàn tiền (chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: Danh sách yêu cầu kèm giao dịch, chiến dịch, người yêu cầu
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/refunds/{id}/approve:
    patch:
      operationId: approveRefund
      summary: Duyệt và hoàn tiền (chỉ admin)
      description: >-
        Trong 1 transaction: đổi completed → refunded có điều kiện (không hoàn 2 lần, 409), gọi cổng
        thanh toán (lỗi → rollback, 502), trừ `currentAmount`/`backerCount` của chiến dịch và trả lại
        suất quà. Ghi audit `donation.refund` + `refund.approve`; thông báo người ủng hộ (kèm email)
        và chủ dự án.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNotesRequest"
      responses:
        "200":
          description: Yêu cầu đã duyệt
        "409":
          description: Yêu cầu đã xử lý hoặc khoản đã hoàn
        "502":
          description: Cổng thanh toán từ chối hoàn tiền
  /admin/refunds/{id}/reject:
    patch:
      operationId: rejectRefund
      summary: Từ chối yêu cầu hoàn tiền (chỉ admin)
      description: Ghi audit `refund.reject`; thông báo người ủng hộ kèm lý do.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNotesRequest"
      responses:
        "200":
          description: Yêu cầu đã từ chối
        "409":
          description: Yêu cầu đã xử lý
  /admin/donations/{id}/refund:
    post:
      operationId: refundDonationDirectly
      summary: Admin hoàn trực tiếp một khoản đã xác nhận (vd. gian lận)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "201":
          description: Đã hoàn
        "409":
          description: Khoản chưa xác nhận hoặc đã hoàn
        "502":
          description: Cổng thanh toán từ chối hoàn tiền
  /admin/reconciliation:
    get:
      operationId: getReconciliation
      summary: Đối soát theo kỳ (chỉ admin)
      description: >-
        Tổng xác nhận/hoàn/ròng theo chiến dịch trong kỳ, và so số liệu đang lưu trên chiến dịch với
        sổ giao dịch toàn thời gian (`mismatch` = lệch). Mặc định 30 ngày gần nhất.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReconFrom"
        - $ref: "#/components/parameters/ReconTo"
        - $ref: "#/components/parameters/ReconCampaign"
      responses:
        "200":
          description: Báo cáo đối soát
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/reconciliation/export:
    get:
      operationId: exportReconciliationCsv
      summary: Xuất CSV giao dịch trong kỳ (chỉ admin)
      description: >-
        CSV UTF-8 (BOM) có chống CSV/formula injection. Người ủng hộ được giả danh (`NUH-…`), không
        có tên/email. Ghi audit `finance.export`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReconFrom"
        - $ref: "#/components/parameters/ReconTo"
        - $ref: "#/components/parameters/ReconCampaign"
      responses:
        "200":
          description: File CSV
          content:
            text/csv: {}
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ReconFrom:
      name: from
      in: query
      description: Ngày bắt đầu (ISO date, bao gồm)
      schema: { type: string, format: date }
    ReconTo:
      name: to
      in: query
      description: Ngày kết thúc (ISO date, bao gồm cả ngày)
      schema: { type: string, format: date }
    ReconCampaign:
      name: campaignId
      in: query
      schema: { type: string, format: uuid }
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CampaignQ:
      name: q
      in: query
      description: Tìm kiếm toàn văn (tiêu đề/mô tả/địa điểm hoặc tên/email tùy endpoint)
      schema:
        type: string
        maxLength: 200
    CampaignCategory:
      name: category
      in: query
      schema:
        type: string
        maxLength: 100
    CampaignStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CampaignStatus"
    CampaignSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [popular, ending, newest, progress, latest]
        default: popular
  responses:
    Forbidden:
      description: Không có quyền thực hiện hành động này
    NotFound:
      description: Không tìm thấy tài nguyên
    TooManyRequests:
      description: Vượt giới hạn rate limit, thử lại sau
  schemas:
    HealthResponse:
      type: object
      required: [service, status, timestamp]
      properties:
        service:
          type: string
          example: backend
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [user, campaign_owner, admin]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: Token base64url lấy từ link trong email

openapi: 3.1.0
info:
  title: Crowdfunding Platform API
  version: 0.3.0
  description: API cho nền tảng gây quỹ cộng đồng Góp Mầm.
servers:
  - url: http://localhost:4000/api/v1
    description: Backend local
paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái business API
      responses:
        "200":
          description: Dịch vụ đang hoạt động
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/register:
    post:
      # Sau khi tạo tài khoản, backend gửi nền email xác minh (xem /auth/verify-email).
      operationId: register
      summary: Đăng ký tài khoản mới
      description: >-
        Không cho tự chọn vai trò `admin` khi đăng ký. Rate limit 3 lần/phút
        theo IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Đăng ký thành công, trả về token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Email đã được đăng ký
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      operationId: login
      summary: Đăng nhập
      description: >-
        Rate limit 5 lần/phút theo IP; khóa tài khoản 5 lần sai liên tiếp
        trong 15 phút.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Sai email hoặc mật khẩu, hoặc tài khoản đang bị khóa
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Làm mới access token
      description: Rate limit 10 lần/phút theo IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Làm mới token thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Refresh token không hợp lệ
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Yêu cầu link đặt lại mật khẩu qua email
      description: |
        Luôn trả cùng một thông điệp dù email có tồn tại hay không (chống dò tài khoản).
        Link có hạn 30 phút, dùng một lần; gửi lại trong vòng 60 giây sẽ bị bỏ qua.
        Rate limit 5 lần/15 phút theo IP. Bản demo ghi link vào log backend thay vì gửi email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Đã tiếp nhận yêu cầu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Email không hợp lệ
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Đặt mật khẩu mới bằng token trong email
      description: |
        Token chỉ dùng một lần. Thành công sẽ gỡ khóa đăng nhập và vô hiệu mọi
        access/refresh token phát hành trước đó. Rate limit 10 lần/15 phút theo IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Đặt lại mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token không hợp lệ, đã dùng hoặc đã hết hạn; hoặc mật khẩu không đạt yêu cầu
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Đổi mật khẩu khi đã đăng nhập
      description: |
        Kiểm tra mật khẩu hiện tại. Thành công sẽ vô hiệu mọi access/refresh token
        phát hành trước đó, hủy link quên mật khẩu còn hạn, gửi email thông báo và
        trả cặp token mới cho phiên hiện tại. Sai mật khẩu hiện tại trả 400 (không
        phải 401, để client không hiểu nhầm là phiên hết hạn).
        Rate limit 5 lần/15 phút theo IP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Mật khẩu hiện tại sai, mật khẩu mới trùng mật khẩu cũ hoặc không đạt yêu cầu
        "401":
          description: Chưa đăng nhập hoặc token hết hạn
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Xác minh email bằng token trong link
      description: |
        Sau khi đăng ký, hệ thống gửi email chứa link `/xac-minh-email?token=...`
        (hạn 24 giờ, dùng một lần; gửi link mới sẽ hủy link cũ).
        Rate limit 10 lần/15 phút theo IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Xác minh thành công
          content:
            application/json:
              schema:
                type: object
                required: [message, email]
                properties:
                  message:
                    type: string
                  email:
                    type: string
                    format: email
        "400":
          description: Token không hợp lệ, đã dùng hoặc đã hết hạn
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Gửi lại email xác minh cho tài khoản đang đăng nhập
      description: Rate limit 3 lần/15 phút theo IP; không gửi lại nếu vừa gửi trong 60 giây.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đã gửi email xác minh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Email đã được xác minh, vừa gửi gần đây, hoặc gửi thất bại
        "401":
          description: Chưa đăng nhập
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /users:
    get:
      operationId: listUsers
      summary: Danh sách người dùng (chỉ admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách người dùng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/me:
    get:
      operationId: getMe
      summary: Lấy thông tin người dùng hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thông tin người dùng hiện tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    get:
      operationId: getUserById
      summary: Lấy thông tin người dùng theo id (chỉ admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      summary: Cập nhật thông tin người dùng
      description: Chỉ chủ tài khoản hoặc admin mới sửa được. Ghi audit `user.update`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      summary: Xóa người dùng (chỉ admin)
      description: Ghi audit `user.delete` (không log mật khẩu).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Xóa thành công
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/role:
    patch:
      operationId: updateUserRole
      summary: Cập nhật vai trò người dùng (chỉ admin)
      description: Ghi audit `user.role.update`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Cập nhật vai trò thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /campaigns:
    get:
      operationId: listCampaigns
      summary: Danh sách chiến dịch công khai
      description: >-
        Không cần đăng nhập. Mặc định chỉ trả chiến dịch ở trạng thái công
        khai (`approved`, `active`, `success`, `ended`) trừ khi lọc `status`.
        Lọc `status` chỉ nhận trạng thái đã công khai; draft/pending/needs_info/rejected/cancelled trả 400.
      parameters:
        - $ref: "#/components/parameters/CampaignQ"
        - $ref: "#/components/parameters/CampaignCategory"
        - $ref: "#/components/parameters/CampaignStatusFilter"
        - $ref: "#/components/parameters/CampaignSort"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách chiến dịch có phân trang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignList"
    post:
      operationId: createCampaign
      summary: Tạo chiến dịch mới (trạng thái `draft`)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "201":
          description: Đã tạo chiến dịch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /campaigns/mine:
    get:
      operationId: listMyCampaigns
      summary: Danh sách chiến dịch của chính chủ dự án đang đăng nhập
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignStatusFilter"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách chiến dịch của tôi (mọi trạng thái)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignList"
  /campaigns/{id}:
    get:
      operationId: getCampaignById
      summary: Chi tiết chiến dịch
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Thông tin chiến dịch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCampaign
      summary: Cập nhật chiến dịch
      description: >-
        Chỉ chủ dự án hoặc admin. Chỉ sửa được khi ở `draft`, `rejected` hoặc
        `needs_info`. Ghi audit `campaign.update`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignRequest"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "403":
          description: Không có quyền, hoặc chiến dịch không ở trạng thái được sửa
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCampaign
      summary: Xóa chiến dịch
      description: >-
        Chỉ chủ dự án hoặc admin, và chỉ khi chiến dịch ở `draft`, `rejected` hoặc `needs_info`
        (chưa từng công khai). Chiến dịch đã phát hành trả 409 — kết thúc qua luồng moderate.
        Ghi audit `campaign.delete`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Xóa thành công
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Chiến dịch đã phát hành, không được xóa
  /campaigns/{id}/submit:
    post:
      operationId: submitCampaign
      summary: Gửi chiến dịch để admin xét duyệt
      description: >-
        Chỉ khi đang ở `draft`, `rejected` hoặc `needs_info` → chuyển sang
        `pending`. Ghi audit `campaign.submit`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Đã gửi duyệt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "403":
          description: Không có quyền, hoặc chiến dịch không ở trạng thái gửi duyệt được
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns/{id}/moderate:
    patch:
      operationId: moderateCampaign
      summary: Admin duyệt/từ chối/tạm dừng/kết thúc chiến dịch
      description: >-
        Chỉ admin. Bắt buộc theo ma trận chuyển trạng thái (vd. không thể
        chuyển `draft` → `ended`); bắt buộc `reason` khi chuyển sang
        `rejected`, `needs_info` hoặc `paused`. Ghi audit `campaign.moderate`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateCampaignRequest"
      responses:
        "200":
          description: Đã cập nhật trạng thái
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: Thiếu `reason` bắt buộc
        "403":
          description: Không phải admin
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Chuyển trạng thái không hợp lệ theo vòng đời chiến dịch

  /donations:
    post:
      operationId: createDonation
      summary: Tạo đơn tài trợ (trạng thái `pending`)
      description: >-
        Idempotent theo `idempotencyKey` — gọi lại với cùng khóa trả về đơn cũ.
        Chặn nếu chiến dịch không ở trạng thái `active` hoặc đã hết hạn.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationRequest"
      responses:
        "201":
          description: Đơn tài trợ đã tạo (hoặc đơn cũ nếu trùng idempotency key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "404":
          description: Chiến dịch không tồn tại
        "409":
          description: Chiến dịch không ở trạng thái `active` hoặc đã hết hạn
  /donations/webhook:
    post:
      operationId: donationWebhook
      summary: Webhook xác nhận thanh toán từ cổng sandbox
      description: >-
        Không cần Bearer token — xác thực bằng chữ ký HMAC-SHA256 ở header
        `X-Signature` (`donationId.status.transactionId.timestamp` ký bằng
        `PAYMENT_WEBHOOK_SECRET`). `timestamp` (epoch ms) phải nằm trong 5
        phút gần nhất, chống replay. Idempotent theo trạng thái đơn tài trợ —
        cập nhật có điều kiện, chống race khi 2 webhook đến gần như đồng
        thời. Rate limit 30 lần/phút theo IP. Trình duyệt không bao giờ được
        gọi endpoint này trực tiếp.
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookDonationRequest"
      responses:
        "200":
          description: Đã cập nhật (hoặc đã được một request khác xử lý trước — idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "401":
          description: Chữ ký sai, thiếu chữ ký, hoặc `timestamp` quá cũ (ghi audit `donation.webhook.rejected`)
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /donations/{id}/confirm:
    post:
      operationId: confirmDemoDonation
      summary: Xác nhận thanh toán ví demo (sandbox)
      description: >-
        Chỉ hoạt động khi cổng thanh toán đang ở chế độ `demo`. Chỉ chủ đơn
        tài trợ mới xác nhận được (404 thay vì 403 để không lộ sự tồn tại của
        đơn thuộc người khác).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDonationRequest"
      responses:
        "200":
          description: Đã xác nhận (hoặc trả về đơn đã xử lý trước đó nếu trùng)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "403":
          description: Cổng thanh toán hiện không ở chế độ demo
        "404":
          description: Không tìm thấy đơn tài trợ thuộc về người dùng hiện tại
  /donations/mine:
    get:
      operationId: listMyDonations
      summary: Lịch sử tài trợ của tôi
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách đơn tài trợ (không phân trang)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donation"
  /donations/{id}:
    get:
      operationId: getDonationById
      summary: Chi tiết một đơn tài trợ
      description: Chỉ người ủng hộ hoặc admin; người khác nhận 404 (không lộ đơn có tồn tại).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Chi tiết đơn tài trợ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "404":
          $ref: "#/components/responses/NotFound"

  /campaigns/{id}/milestones:
    get:
      operationId: listCampaignMilestones
      summary: Danh sách mốc tiến độ của một chiến dịch
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách mốc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneListResult"
    post:
      operationId: createMilestone
      summary: Tạo mốc tiến độ mới
      description: >-
        Chỉ chủ dự án hoặc admin; chặn khi chiến dịch đã kết thúc
        (`success`/`failed`/`cancelled`/`ended`). Ghi audit `milestone.create`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMilestoneRequest"

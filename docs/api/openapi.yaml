          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAlert"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/status:
    patch:

          description: Danh sách bản ghi audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/risks:
    get:
      operationId: adminListRisks
      summary: Danh sách cảnh báo rủi ro AI
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, dismissed]
        - name: level
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách cảnh báo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAlertList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/risks/generate:

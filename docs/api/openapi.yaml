          enum: [campaign_approved, campaign_rejected, campaign_needs_info, campaign_paused, campaign_resumed, campaign_ended, donation_received, donation_confirmed, milestone_completed, progress_update, report_resolved, system]
        title: { type: string, maxLength: 200 }
        message: { type: string }
        link:
          type: [string, "null"]
          description: Đường dẫn tương đối trong web để mở khi bấm thông báo
        relatedId: { type: [string, "null"] }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      required: [items, total, unread, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total: { type: integer }
        unread: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    UploadedImage:
      type: object
      required: [id, url, mimeType, sizeBytes]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: Đường dẫn tương đối, dùng cho `imageUrl`
          example: /api/v1/media/campaigns/3f2b8c1e-5d4a-4b7e-9c2d-1a2b3c4d5e6f.webp
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          maximum: 5242880
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        reporter:
          description: Chỉ có ở API admin; email chỉ hiển thị cho admin
          allOf:
            - $ref: "#/components/schemas/User"
        campaignId:
          type: string
          format: uuid
          nullable: true
        campaign:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Campaign"
        reason:
          $ref: "#/components/schemas/ReportReason"
        description:
          type: string
        status:
          $ref: "#/components/schemas/ReportStatus"
        adminNotes:
          type: string
          nullable: true
        resolvedBy:
          type: string
          format: uuid
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        campaignPaused:
          type: boolean
        commentId:
          type: [string, "null"]
          description: Báo cáo nhắm vào một bình luận (nếu có)
        commentHidden:
          type: boolean
          description: Bình luận đã bị ẩn khi xử lý báo cáo này
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReportList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    PlatformStats:
      type: object
      properties:
        totalRaised:
          type: number
        totalBackers:
          type: integer
        publicCampaigns:
          type: integer
        activeCampaigns:
          type: integer
        successfulCampaigns:
          type: integer
    CampaignLedger:
      type: object
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              donorName:
                type: string
                nullable: true
              amount:
                type: number
              currency:
                type: string
              paymentMethod:
                type: string
                nullable: true
              reference:
                type: string
                example: "•••7D6C5B"
              completedAt:
                type: string
                format: date-time

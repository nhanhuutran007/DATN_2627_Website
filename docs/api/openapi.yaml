      description: Ghi audit `milestone_update.create`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMilestoneUpdateRequest"
      responses:
        "201":
          description: Đã thêm bài cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneUpdate"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
